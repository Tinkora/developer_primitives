[workspace]
members = [
    "crates/uuid_factory_cli",
    "crates/uuid_factory_core",
    "crates/uuid_factory_web",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Tinkora/developer_primitives"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.11", default-features = false }
ulid = { version = "3.0", default-features = false }
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
web-time = "1.1"

[profile.release]
lto = "thin"
strip = true
