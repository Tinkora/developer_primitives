name: Rust and WASM quality

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    uses: Tinkora/.github/.github/workflows/reusable-rust-quality.yml@e967aed0860957b24daf57e66766713c60b5bcae
    with:
      toolchain: '1.95.0'
      msrv: '1.95.0'
      locked: true

  wasm:
    uses: Tinkora/.github/.github/workflows/reusable-wasm-quality.yml@e967aed0860957b24daf57e66766713c60b5bcae
    with:
      working-directory: crates/uuid_factory_web
      toolchain: '1.95.0'
      node-version: '24'
      locked: true
      playwright-smoke: false
