name: CodeQL

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Required for CodeQL to upload SARIF results.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        with:
          languages: rust
          build-mode: manual

      - name: Build Rust workspace
        shell: bash
        run: cargo build --workspace --locked

      - name: Analyze workspace
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
